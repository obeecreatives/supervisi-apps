<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  
  <!-- Outer Ring Accent -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="#10b981" stroke-opacity="0.2" stroke-width="4"/>

  <!-- Shield Badge -->
  <path d="M256 96 L376 144 V264 C376 342 325 408 256 428 C187 408 136 342 136 264 V144 Z" 
        fill="url(#brand)" filter="url(#glow)"/>

  <!-- Inner Dark Shield -->
  <path d="M256 120 L354 160 V260 C354 326 312 384 256 402 C200 384 158 326 158 260 V160 Z" 
        fill="#09131f"/>

  <!-- Database & High Performance Lightning Core -->
  <!-- Cylinder Top -->
  <ellipse cx="256" cy="200" rx="60" ry="18" fill="url(#brand)"/>
  <!-- Cylinder Body 1 -->
  <path d="M196 200 v30 c0 10 27 18 60 18 s60 -8 60 -18 v-30 Z" fill="#047857"/>
  <ellipse cx="256" cy="230" rx="60" ry="18" fill="none" stroke="#34d399" stroke-width="3"/>
  <!-- Cylinder Body 2 -->
  <path d="M196 235 v30 c0 10 27 18 60 18 s60 -8 60 -18 v-30 Z" fill="#065f46"/>
  <ellipse cx="256" cy="265" rx="60" ry="18" fill="none" stroke="#34d399" stroke-width="3"/>

  <!-- Lightning Bolt -->
  <path d="M266 270 L236 325 h28 l-14 45 44 -55 h-28 Z" fill="#38bdf8" filter="url(#glow)"/>
</svg>
